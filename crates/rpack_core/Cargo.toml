[package]
name = "rpack_core"
description = "Atlas packing, configuration and data types shared by the rpack tools"
version = "0.7.0"
edition = "2024"
repository = "https://github.com/Leinnan/rpack.git"
homepage = "https://github.com/Leinnan/rpack"
authors = ["Piotr Siuszko <siuszko@zoho.com>"]
license = "MIT OR Apache-2.0"
keywords = ["texture", "atlas", "packing", "2d"]

[features]
default = []
# Derives Bevy traits on the atlas types. `bevy_rpack` enables this.
bevy = ["dep:bevy_asset", "dep:bevy_math", "dep:bevy_reflect"]
# Derives `clap::ValueEnum` on `SaveImageFormat`. `rpack_cli` enables this.
clap = ["dep:clap"]
# Reads configs from disk and resolves their glob patterns. Native only.
config_ext = ["dep:anyhow", "dep:glob"]

[dependencies]
anyhow = { version = "1", optional = true }
bevy_asset = { version = "0.20", optional = true }
bevy_math = { version = "0.20", optional = true }
bevy_reflect = { version = "0.20", optional = true }
image = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texture_packer = { workspace = true }
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"], optional = true }
glob = { version = "0.3", optional = true }

[lints.rust]
unsafe_code = "forbid"
