name: itch.io Build

# Builds the web app and the desktop installers, then pushes each one to its own itch.io channel.
# Nothing is pushed unless every build succeeds, so the channels stay on the same version.
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        description: "Push the builds to itch.io (otherwise only build them)"
        default: true
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - "README.md"
# to only run when you do a new github release, comment out above part and uncomment the below trigger.
# on:
#   release:
#     types:
#       - published

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # repo checkout
      - uses: dtolnay/rust-toolchain@stable # get rust toolchain for wasm
        with:
          targets: wasm32-unknown-unknown
      - name: Rust Cache # cache the rust build artefacts
        uses: Swatinem/rust-cache@v2
      - name: Download and install Trunk binary
        working-directory: crates/rpack_egui
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
      - name: Build
        working-directory: crates/rpack_egui
        # itch.io serves uploads from a nested path, so all urls have to be relative.
        run: ./trunk build --release --public-url ./
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: crates/rpack_egui/dist
          if-no-files-found: error

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        system: [windows-latest, macos-15, ubuntu-22.04]
    uses: ./.github/workflows/bundle.yml
    with:
      runningSystem: ${{ matrix.system }}

  publish:
    if: inputs.publish
    needs: [build-web, build-desktop]
    runs-on: ubuntu-latest # the publish action runs in Docker, which needs a Linux runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { artifact: web, channel: wasm }
          - { artifact: windows-latest, channel: windows }
          - { artifact: macos-15, channel: mac }
          - { artifact: ubuntu-22.04, channel: linux }
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rpack_egui") | .version')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: upload
      - name: Restore AppImage permissions
        # Artifacts don't keep file permissions.
        run: find upload -name '*.AppImage' -exec chmod +x {} +
      - name: Itch.io - Publish
        uses: KikimoraGames/itch-publish@v0.0.3
        with:
          gameData: ./upload
          itchUsername: mevlyshkin
          itchGameId: rpack
          buildChannel: ${{ matrix.channel }}
          buildNumber: ${{ steps.version.outputs.version }}
          butlerApiKey: ${{ secrets.butlerApi }}
