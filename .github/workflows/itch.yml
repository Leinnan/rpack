name: itch.io Build

# By default, runs if you push to master. keeps your deployed app in sync with master branch.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - "README.md"
# to only run when you do a new github release, comment out above part and uncomment the below trigger.
# on:
#   release:
#     types:
#       - published

permissions:
  contents: write # for committing to gh-pages branch.

jobs:
  build-itch-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # repo checkout
      - uses: dtolnay/rust-toolchain@stable # get rust toolchain for wasm
        with:
          targets: wasm32-unknown-unknown
      - name: Rust Cache # cache the rust build artefacts
        uses: Swatinem/rust-cache@v2
      - name: Download and install Trunk binary
        working-directory: crates/rpack_egui
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
      - name: Build
        working-directory: crates/rpack_egui
        # itch.io serves uploads from a nested path, so all urls have to be relative.
        run: ./trunk build --release --public-url ./
      - name: Itch.io - Publish
        uses: KikimoraGames/itch-publish@v0.0.3
        with:
          gameData: ./crates/rpack_egui/dist
          itchUsername: mevlyshkin
          itchGameId: rpack
          buildChannel: wasm
          butlerApiKey: ${{ secrets.butlerApi }}
