on: [push, pull_request]

name: CI

env:
  # --cfg=web_sys_unstable_apis is required to enable the web_sys clipboard API which egui_web uses
  # https://rustwasm.github.io/wasm-bindgen/api/web_sys/struct.Clipboard.html
  # https://rustwasm.github.io/docs/wasm-bindgen/web-sys/unstable-apis.html
  RUSTFLAGS: -D warnings --cfg=web_sys_unstable_apis
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  wasm:
    name: Wasm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p rpack_egui --target wasm32-unknown-unknown

  icons:
    name: Icon subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask icons-subset --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Vulkan (lavapipe) so the egui_kittest snapshot tests can render without a GPU.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libvulkan1 mesa-vulkan-drivers
      - run: cargo clippy --locked --workspace --all-targets
      # The committed snapshot images are recorded on macOS. Other GPUs rasterize
      # slightly differently, so there the snapshots are re-recorded instead of compared,
      # and uploaded for review below; every other assertion still fails the job.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" != macOS ]; then export UPDATE_SNAPSHOTS=1; fi
          cargo test --locked --workspace --no-fail-fast
      - name: Upload re-recorded snapshots
        if: always() && runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os }}
          path: crates/rpack_egui/tests/snapshots/
          if-no-files-found: ignore
